name: Check venue listings

on:
  schedule:
    # Runs at the top of every hour. GitHub doesn't guarantee exact timing
    # for scheduled workflows -- expect runs delayed a few minutes during
    # busy periods, which doesn't matter for daily-scale content like this.
    - cron: "41 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py

      - name: Commit updated state
        run: |
          git config user.name "venue-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state"
          git push
