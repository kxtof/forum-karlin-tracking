name: Check venue listings

on:
  schedule:
    # Runs at the top of every hour. GitHub doesn't guarantee exact timing
    # for scheduled workflows -- expect runs delayed a few minutes during
    # busy periods, which doesn't matter for daily-scale content like this.
    - cron: "41 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

concurrency:
  group: venue-monitor-check
  cancel-in-progress: false  # let a running check finish rather than killing it mid-commit

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py

      - name: Commit updated state
        run: |
          git config user.name "venue-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update state"
          # The remote may have moved since checkout (e.g. you pushed a
          # code change while this ran). Rebase onto the latest and retry
          # the push a couple of times before giving up.
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
