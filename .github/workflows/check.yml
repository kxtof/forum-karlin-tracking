name: Check venue listings

on:
  # No schedule: block -- see dune_check.yml for why. This one's driven by
  # cron-job.org hitting this workflow's dispatch endpoint hourly instead.
  workflow_dispatch: {}  # also lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state.json

concurrency:
  group: venue-monitor-check
  cancel-in-progress: false  # let a running check finish rather than killing it mid-commit

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py

      - name: Commit updated state
        run: |
          git config user.name "venue-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update state"
          git fetch origin main
          git merge origin/main -X ours --no-edit
          git push
